[package]
name = "hns-node"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
rocksdb-backend = ["hns-store/rocksdb-backend"]

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap.workspace = true
hns-chain = { path = "../hns-chain" }
hns-consensus = { path = "../hns-consensus" }
hns-mempool = { path = "../hns-mempool" }
hns-mining = { path = "../hns-mining" }
hns-p2p = { path = "../hns-p2p" }
hns-primitives = { path = "../hns-primitives" }
hns-rpc = { path = "../hns-rpc" }
hns-state = { path = "../hns-state" }
hns-store = { path = "../hns-store" }
hns-sync = { path = "../hns-sync" }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "hsrd"
path = "src/main.rs"
