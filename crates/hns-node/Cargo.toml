[package]
name = "hns-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["rocksdb-backend"]
rocksdb-backend = ["hns-state/rocksdb-backend", "hns-store/rocksdb-backend"]
experimental-authority = []

[dependencies]
anyhow.workspace = true
axum = "0.8"
blake2 = "0.10"
clap.workspace = true
hns-chain = { path = "../hns-chain" }
hns-consensus = { path = "../hns-consensus" }
hns-mempool = { path = "../hns-mempool" }
hns-marketplace-protocol.workspace = true
hns-mining = { path = "../hns-mining" }
hns-p2p = { path = "../hns-p2p" }
hns-protocol-primitives.workspace = true
hns-primitives = { path = "../hns-primitives" }
hns-rpc = { path = "../hns-rpc" }
hns-state = { path = "../hns-state" }
hns-store = { path = "../hns-store", default-features = false }
hns-swap.workspace = true
hns-sync = { path = "../hns-sync" }
hns-wallet-index = { path = "../hns-wallet-index" }
hns-denuo-market-relay = { path = "../hns-denuo-market-relay" }
hns-urkel = { path = "../hns-urkel" }
hex = "0.4"
k256.workspace = true
libc = "0.2"
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
hns-chain = { path = "../hns-chain", features = ["test-fixtures"] }

[[bin]]
name = "hsrd"
path = "src/main.rs"

[[bin]]
name = "hsrd-performance-gate"
path = "src/bin/hsrd_performance_gate.rs"

[[bin]]
name = "hsrd-state-manifest"
path = "src/bin/hsrd_state_manifest.rs"

[[bin]]
name = "hsrd-rollback-manifest"
path = "src/bin/hsrd_rollback_manifest.rs"

[[bin]]
name = "hsrd-storage-maintenance"
path = "src/bin/hsrd_storage_maintenance.rs"

[[bin]]
name = "hsrd-name-tree-diagnose"
path = "src/bin/hsrd_name_tree_diagnose.rs"
