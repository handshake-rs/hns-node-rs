[workspace]
members = [
    "crates/hns-primitives",
    "crates/hns-consensus",
    "crates/hns-goosig",
    "crates/hns-secp256k1",
    "crates/hns-chain",
    "crates/hns-state",
    "crates/hns-store",
    "crates/hns-p2p",
    "crates/hns-sync",
    "crates/hns-mempool",
    "crates/hns-mining",
    "crates/hns-rpc",
    "crates/hns-node",
    "crates/hns-testkit",
    "crates/hns-urkel",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
