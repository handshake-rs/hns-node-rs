[workspace]
members = [
    "crates/hns-primitives",
    "crates/hns-consensus",
    "crates/hns-goosig",
    "crates/hns-secp256k1",
    "crates/hns-chain",
    "crates/hns-state",
    "crates/hns-store",
    "crates/hns-p2p",
    "crates/hns-sync",
    "crates/hns-mempool",
    "crates/hns-mining",
    "crates/hns-rpc",
    "crates/hns-node",
    "crates/hns-testkit",
    "crates/hns-urkel",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
publish = false
repository = "https://github.com/handshake-rs/hns-node-rs"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
hns-dns-relay-protocol = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }
hns-p2p-experimental = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
thiserror = "2.0"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
