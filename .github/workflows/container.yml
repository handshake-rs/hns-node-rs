name: Container

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/container.yml
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - compose.yaml
      - crates/**
      - docker/**
      - fixtures/**
      - rust-toolchain.toml
      - vendor/**
  pull_request:
    paths:
      - .github/workflows/container.yml
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - compose.yaml
      - crates/**
      - docker/**
      - fixtures/**
      - rust-toolchain.toml
      - vendor/**
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  REGISTRY_IMAGE: ghcr.io/handshake-rs/hns-node-rs

jobs:
  verify:
    name: Verify ${{ matrix.platform }} image
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build native image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=hsrd-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=hsrd-${{ matrix.suffix }}
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: hsrd:verify-${{ matrix.suffix }}

      - name: Verify image runtime and configuration
        env:
          VERIFY_IMAGE: hsrd:verify-${{ matrix.suffix }}
        run: |
          test "$(docker image inspect "$VERIFY_IMAGE" --format '{{.Architecture}}')" = "${{ matrix.suffix == 'amd64' && 'amd64' || 'arm64' }}"
          docker run --rm "$VERIFY_IMAGE" --version
          docker run --rm "$VERIFY_IMAGE" \
            --network mainnet \
            --data-dir /var/lib/hsrd \
            --rpc-bind 127.0.0.1:12037 \
            --native-sync \
            --p2p-discovery \
            --check-config
          test "$(docker run --rm --entrypoint /usr/bin/id "$VERIFY_IMAGE" -u)" = 10001

  release-platforms:
    name: Release ${{ matrix.platform }} image
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release source and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag is not semantic versioning: $RELEASE_TAG" >&2
            exit 1
          fi
          workspace_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test -n "$workspace_version"
          if [[ "${RELEASE_TAG#v}" != "$workspace_version" ]]; then
            echo "release tag $RELEASE_TAG does not match workspace version $workspace_version" >&2
            exit 1
          fi
          release_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$release_commit" origin/main

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/handshake-rs/hns-node-rs

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=hsrd-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=hsrd-${{ matrix.suffix }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true

      - name: Verify published platform image
        env:
          PLATFORM_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "${REGISTRY_IMAGE}@${PLATFORM_DIGEST}"
          test "$(docker image inspect "${REGISTRY_IMAGE}@${PLATFORM_DIGEST}" --format '{{.Architecture}}')" = "${{ matrix.suffix == 'amd64' && 'amd64' || 'arm64' }}"
          docker run --rm "${REGISTRY_IMAGE}@${PLATFORM_DIGEST}" --version
          docker run --rm "${REGISTRY_IMAGE}@${PLATFORM_DIGEST}" \
            --network mainnet \
            --data-dir /var/lib/hsrd \
            --rpc-bind 127.0.0.1:12037 \
            --native-sync \
            --p2p-discovery \
            --check-config

      - name: Export platform digest
        env:
          PLATFORM_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/hsrd-digests
          touch "/tmp/hsrd-digests/${PLATFORM_DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hsrd-digest-${{ matrix.suffix }}
          path: /tmp/hsrd-digests/*
          if-no-files-found: error
          retention-days: 1

  release-manifest:
    name: Publish multi-platform release manifest
    if: github.event_name == 'release'
    needs: release-platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/hsrd-digests
          pattern: hsrd-digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Create release manifest
        id: manifest
        env:
          RELEASE_TAGS_JSON: ${{ steps.meta.outputs.json }}
        working-directory: /tmp/hsrd-digests
        run: |
          mapfile -t tags < <(jq --raw-output '.tags[] | "--tag\n" + .' <<< "$RELEASE_TAGS_JSON")
          digests=()
          for digest in *; do
            digests+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          test "${#digests[@]}" = 2
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
          primary_tag=$(jq --raw-output '.tags[0]' <<< "$RELEASE_TAGS_JSON")
          manifest_digest=$(docker buildx imagetools inspect "$primary_tag" --format '{{json .Manifest}}' | jq --raw-output '.digest')
          test -n "$manifest_digest"
          echo "primary-tag=$primary_tag" >> "$GITHUB_OUTPUT"
          echo "digest=$manifest_digest" >> "$GITHUB_OUTPUT"

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${{ steps.manifest.outputs.primary-tag }}"

      - name: Attest release manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Write release summary
        env:
          PUBLISHED_DIGEST: ${{ steps.manifest.outputs.digest }}
          PUBLISHED_TAG: ${{ steps.manifest.outputs.primary-tag }}
        run: |
          {
            echo '### Published hsrd container'
            echo
            echo "- Tag: \`$PUBLISHED_TAG\`"
            echo "- Digest: \`$PUBLISHED_DIGEST\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
