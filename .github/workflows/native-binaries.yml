name: Native hsrd binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to build (for example v0.3.9)
        required: true
        type: string
      target_group:
        description: Native runner group to build
        required: true
        default: all
        type: choice
        options: [all, linux, macos, windows]

permissions:
  contents: read

concurrency:
  group: native-hsrd-${{ inputs.release_tag }}-${{ inputs.target_group }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify exact release source
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      tree: ${{ steps.verify.outputs.tree }}
      version: ${{ steps.verify.outputs.version }}
      matrix: ${{ steps.verify.outputs.matrix }}
    steps:
      - name: Check out main and all tags
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, source version, and published release
        id: verify
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'This workflow must be dispatched from main.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != handshake-rs/hns-node-rs ]]; then
            echo 'Native release artifacts must come from the canonical repository.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a version tag such as v0.3.9.' >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          tag_tree=$(git rev-parse --verify "$tag_commit^{tree}")
          main_commit=$(git rev-parse --verify HEAD)
          git merge-base --is-ancestor "$tag_commit" "$main_commit"
          version=$(git show "$tag_commit:Cargo.toml" |
            python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match workspace version $version." >&2
            exit 1
          fi
          release_json=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and (.published_at | type == "string")' \
            <<< "$release_json" >/dev/null
          {
            echo "commit=$tag_commit"
            echo "tree=$tag_tree"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          matrix_json='{"include":[{"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-24.04","source":"published-container","binary":"hsrd","group":"linux"},{"target":"aarch64-apple-darwin","runner":"macos-15","source":"cargo","binary":"hsrd","group":"macos"},{"target":"x86_64-apple-darwin","runner":"macos-15-intel","source":"cargo","binary":"hsrd","group":"macos"},{"target":"x86_64-pc-windows-msvc","runner":"windows-2025","source":"cargo","binary":"hsrd.exe","group":"windows"}]}'
          selected_group='${{ inputs.target_group }}'
          if [[ "$selected_group" != all ]]; then
            matrix_json=$(jq -c --arg group "$selected_group" \
              '{include: [.include[] | select(.group == $group)]}' <<< "$matrix_json")
          fi
          if ! jq -e '.include | length > 0' <<< "$matrix_json" >/dev/null; then
            echo "No native build targets selected for $selected_group" >&2
            exit 1
          fi
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  build:
    name: Build and qualify ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
      SOURCE_TREE: ${{ needs.preflight.outputs.tree }}
      TARGET: ${{ matrix.target }}
      BINARY_NAME: ${{ matrix.binary }}
    steps:
      # The workflow and packaging helper are on main. An older tag need not
      # contain either file, so keep tooling separate from the release source.
      - name: Check out review tooling from main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false

      - name: Check out exact release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Verify release source checkout
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse --verify 'HEAD^{tree}')" = "$SOURCE_TREE"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_COMMIT"
          python_cmd=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_cmd=python; fi
          test "$("$python_cmd" -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" = "$VERSION"
          mkdir -p ../native-bin ../native-logs ../native-artifact

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes build-essential clang libclang-dev libssl-dev pkg-config

      - name: Configure macOS native libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f "$(brew --prefix openssl@3)/include/openssl/ssl.h"; then
            brew install openssl@3
          fi
          llvm_prefix=$(brew --prefix llvm@18)
          if ! test -f "$llvm_prefix/lib/libclang.dylib"; then
            brew install llvm@18
            llvm_prefix=$(brew --prefix llvm@18)
          fi
          test -f "$llvm_prefix/lib/libclang.dylib"
          {
            echo "LIBCLANG_PATH=$llvm_prefix/lib"
            echo "OPENSSL_DIR=$(brew --prefix openssl@3)"
            echo 'OPENSSL_STATIC=1'
            echo 'MACOSX_DEPLOYMENT_TARGET=13.0'
          } >> "$GITHUB_ENV"

      - name: Configure Windows native libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            throw 'The Windows runner is missing libclang.dll.'
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install openssl:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg OpenSSL installation failed.' }
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=$llvmBin"
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          Add-Content $env:GITHUB_ENV 'VCPKGRS_TRIPLET=x64-windows-static'
          Add-Content $env:GITHUB_ENV 'OPENSSL_STATIC=1'

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add "$TARGET" --toolchain 1.97.1

      - name: Extract the exact Linux amd64 release binary
        if: matrix.source == 'published-container'
        id: linux_binary
        continue-on-error: true
        shell: bash
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            image="ghcr.io/handshake-rs/hns-node-rs:canary-$RELEASE_TAG"
            if ! docker pull --platform linux/amd64 "$image"; then
              image="ghcr.io/handshake-rs/hns-node-rs:$RELEASE_TAG"
              docker pull --platform linux/amd64 "$image"
            fi
            container_id=$(docker create --platform linux/amd64 "$image")
            trap 'docker rm --force "$container_id" >/dev/null' EXIT
            test "$(docker inspect "$container_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_COMMIT"
            test "$(docker inspect "$container_id" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$RELEASE_TAG"
            test "$(docker inspect "$container_id" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = 'https://github.com/handshake-rs/hns-node-rs'
            docker inspect "$container_id" --format '{{.Image}}'
            docker cp "$container_id:/usr/local/bin/hsrd" ../native-bin/hsrd
            chmod 755 ../native-bin/hsrd
            file ../native-bin/hsrd
            file -b ../native-bin/hsrd | grep -F 'x86-64'
            ldd ../native-bin/hsrd
            if ldd ../native-bin/hsrd | grep -q 'not found'; then
              echo 'The extracted Linux binary has unresolved shared libraries.' >&2
              exit 1
            fi
          } 2>&1 | tee ../native-logs/build.log

      - name: Build with native Cargo on macOS and Windows
        if: matrix.source == 'cargo'
        id: native_build
        continue-on-error: true
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          {
            cargo +1.97.1 build --locked --release --target "$TARGET" -p hns-node --bin hsrd
            cp "target/$TARGET/release/$BINARY_NAME" "../native-bin/$BINARY_NAME"
            if [[ "$RUNNER_OS" == macOS ]]; then
              otool -L "../native-bin/$BINARY_NAME"
              while IFS= read -r dylib; do
                case "$dylib" in
                  /usr/lib/*|/System/Library/*) ;;
                  *) echo "Non-system macOS dylib in release binary: $dylib" >&2; exit 1 ;;
                esac
              done < <(otool -L "../native-bin/$BINARY_NAME" | awk 'NR > 1 {print $1}')
              otool -l "../native-bin/$BINARY_NAME" |
                tee ../native-logs/macos-load-commands.log
              python3 - ../native-logs/macos-load-commands.log <<'PY'
          import pathlib, re, sys
          commands = re.split(r"(?=^Load command \d+$)", pathlib.Path(sys.argv[1]).read_text(), flags=re.M)
          minimums = []
          for command in commands:
              if re.search(r"^\s*cmd LC_BUILD_VERSION$", command, re.M):
                  match = re.search(r"^\s*minos (\d+)\.(\d+)$", command, re.M)
              elif re.search(r"^\s*cmd LC_VERSION_MIN_MACOSX$", command, re.M):
                  match = re.search(r"^\s*version (\d+)\.(\d+)$", command, re.M)
              else:
                  continue
              if match is None:
                  raise SystemExit("macOS binary has a malformed minimum OS load command")
              minimums.append(tuple(map(int, match.groups())))
          if not minimums or any(version > (13, 0) for version in minimums):
              raise SystemExit("macOS binary requires newer than macOS 13 or lacks a minimum OS version")
          PY
            fi
          } 2>&1 | tee ../native-logs/build.log

      - name: Smoke test native executable
        if: always() && (steps.linux_binary.outcome == 'success' || steps.native_build.outcome == 'success')
        id: smoke
        continue-on-error: true
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          {
            observed=$("../native-bin/$BINARY_NAME" --version)
            test "$observed" = "hsrd $VERSION"
            printf '%s\n' "$observed"
            "../native-bin/$BINARY_NAME" --network mainnet \
              --data-dir ../native-logs/config-smoke-data --check-config
          } 2>&1 | tee ../native-logs/smoke.log

      - name: Run native storage durability tests
        if: always() && (steps.linux_binary.outcome == 'success' || steps.native_build.outcome == 'success')
        id: storage
        continue-on-error: true
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo +1.97.1 test --locked --target "$TARGET" -p hns-store 2>&1 |
            tee ../native-logs/storage-tests.log
          if [[ "$RUNNER_OS" == Windows ]]; then
            cargo +1.97.1 test --locked --target "$TARGET" -p hns-node --lib \
              name_page 2>&1 |
              tee ../native-logs/name-page-tests.log
          fi

      - name: Package native archive and per-target provenance
        if: >-
          always() &&
          (steps.linux_binary.outcome == 'success' || steps.native_build.outcome == 'success') &&
          steps.smoke.outcome == 'success' && steps.storage.outcome == 'success'
        id: package
        continue-on-error: true
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python_cmd=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_cmd=python; fi
          "$python_cmd" ../release-tools/scripts/package-native-binary.py \
            --repo-root . \
            --binary "../native-bin/$BINARY_NAME" \
            --output-dir ../native-artifact \
            --target "$TARGET" \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_COMMIT" \
            --tree "$SOURCE_TREE"

      - name: Retain archive, provenance, and qualification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ inputs.release_tag }}-${{ matrix.target }}-review
          path: |
            native-artifact/*
            native-logs/*
          if-no-files-found: warn
          retention-days: 30

      - name: Require all native qualification steps
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.source }}" == published-container ]]; then
            test "${{ steps.linux_binary.outcome }}" = success
          else
            test "${{ steps.native_build.outcome }}" = success
          fi
          test "${{ steps.smoke.outcome }}" = success
          test "${{ steps.storage.outcome }}" = success
          test "${{ steps.package.outcome }}" = success
